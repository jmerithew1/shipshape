# CI — runs on every push and pull request (Week-4 implementation rule 4).
# Jobs: build, lint, type-check, test (api against a real postgres, web),
# coverage, dependency audit, secret scan, source/license inventory, and a
# SHA-tagged build artifact (rule 5: build once, promote — the artifact
# uploaded here is the artifact deploys should ship).
#
# Documented deviation: `pnpm audit` gates at --audit-level critical, not
# high. 50 high advisories are pre-existing transitive debt (react-router,
# minimatch, undici et al. — major-version bumps); they are inventoried by
# the audit-report artifact each run and tracked in CHANGES.md. Criticals
# are pinned out via pnpm-workspace.yaml overrides.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ship:ship_dev_password@localhost:5433/ship_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Prepare test database schema
        run: pnpm --filter @ship/api exec tsx src/db/migrate.ts

      - name: Test (api)
        run: pnpm --filter @ship/api test

      - name: Test (web)
        run: pnpm --filter @ship/web test

      # The SDK is a shipped package with its own suite; without this step its
      # 81 tests never ran in CI, so a published client could regress silently.
      - name: Test (sdk)
        run: pnpm --filter @ship/sdk test

      # cli and slack were NOT run here until 2026-08-16, and that is exactly
      # how 21 failures sat under a "all suites green" claim for four days:
      # 914afaf moved verifyWebhook to the derived signing key and updated the
      # SDK's own test helper, but the two integration harnesses kept signing
      # with the raw secret. Nothing in CI executed them, so nothing said so.
      # Both consume @ship/sdk, so they are the suites most exposed to exactly
      # this kind of contract drift — which makes their absence the worst of
      # the three to have had.
      - name: Test (cli)
        run: pnpm --filter @ship/cli test

      - name: Test (slack)
        run: pnpm --filter @ship/slack test

      # Coverage re-runs all 59 api suites a second time under v8
      # instrumentation. It has NO thresholds — its output is an uploaded
      # report, not a gate — while `Test (api)` above is the actual
      # correctness gate. It was nonetheless failing every run on the hosted
      # runner (passes locally, 839/839), blocking the deploy job behind a
      # step that asserts nothing. Give it heap headroom, and do not let a
      # reporting step gate a release.
      - name: OpenAPI spec drift (committed copy must match the generator)
        run: |
          pnpm --filter @ship/api openapi:v1
          if ! git diff --quiet -- docs/openapi.json; then
            echo "::error::docs/openapi.json is stale. Run: pnpm --filter @ship/api openapi:v1"
            git --no-pager diff -- docs/openapi.json
            exit 1
          fi
          echo "spec is byte-current with the generator"

      - name: Coverage (api)
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter @ship/api run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: api/coverage/
          retention-days: 14

      - name: Dependency audit (gate at critical; see header note)
        run: |
          pnpm audit --json > audit-report.json || true
          pnpm audit --audit-level critical

      - name: Source & license inventory
        run: pnpm licenses list --json > license-inventory.json

      - name: Upload inventories
        uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: |
            audit-report.json
            license-inventory.json
          retention-days: 30

      - name: Package SHA-tagged build artifact
        run: |
          tar czf "ship-build-${GITHUB_SHA::7}.tar.gz" shared/dist api/dist web/dist
          echo "Artifact for commit ${GITHUB_SHA}" > provenance.txt
          sha256sum "ship-build-${GITHUB_SHA::7}.tar.gz" >> provenance.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ship-build-${{ github.sha }}
          path: |
            ship-build-*.tar.gz
            provenance.txt
          retention-days: 30

  # The brief's Required Capabilities: "Drill runs in CI on every PR. Any
  # regression past the configured threshold fails the build."
  #
  # `verify-deployment` below cannot serve that clause: it targets live prod,
  # and prod only ever reflects `main`, so running it on a PR would exercise
  # the wrong code and report a green that means nothing. The honest reading is
  # the one the brief itself gives for the harness — "against a containerized
  # Ship instance" — so this job boots Ship from THIS PR's code and drills that.
  #
  # Same drill binary, same threshold, same non-zero exit. The only difference
  # is the target, which is the whole point.
  drill-pr:
    name: TTFE drill (Ship booted from this PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ship
          POSTGRES_PASSWORD: ship_dev_password
          POSTGRES_DB: ship_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ship -d ship_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ship:ship_dev_password@localhost:5433/ship_dev
      NODE_ENV: development
      PORT: 3000
      # The drill subscribes and creates; the deliverer must actually run.
      WEBHOOKS_ENABLED: 'true'
      # No agent work here, and its sweep would only add noise to the timing.
      FLEETGRAPH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Recursive build, in dependency order: the drill compiles against
      # @ship/sdk, and without sdk/dist its tsc fails outright.
      - run: pnpm build

      - name: Migrate
        run: pnpm --filter @ship/api db:migrate

      - name: Provision the first-party drill app
        # Migration 043 seeds `ship_app_ttfe_drill` by copying the GRADER app's
        # secret hash — deliberately a no-op on a fresh database, where no
        # grader app exists yet. So seed the grader app first, then replay 043
        # (it is ON CONFLICT DO UPDATE, so replaying is safe) to mint the
        # first-party app the drill needs: Client Credentials rejects a
        # non-first-party client, and the grader app is read-only by design.
        id: drillapp
        run: |
          secret=$(pnpm --silent --filter @ship/api seed:grader-app \
            | grep -oE 'ship_sec_[a-f0-9]+' | head -1)
          if [ -z "$secret" ]; then echo "::error::grader app seed printed no secret"; exit 1; fi
          echo "::add-mask::$secret"
          echo "secret=$secret" >> "$GITHUB_OUTPUT"
          PGPASSWORD=ship_dev_password psql -h localhost -p 5433 -U ship -d ship_dev \
            -v ON_ERROR_STOP=1 -f api/src/db/migrations/043_ttfe_drill_app.sql

      - name: Boot Ship from this PR
        run: |
          node api/dist/index.js > api.log 2>&1 &
          echo $! > api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ready >/dev/null 2>&1; then
              echo "ship up after ${i} checks"; exit 0
            fi
            sleep 2
          done
          echo "::error::Ship never became ready"; cat api.log; exit 1

      - name: TTFE drill (over threshold fails the build)
        env:
          SHIP_CLIENT_ID: ship_app_ttfe_drill
          SHIP_CLIENT_SECRET: ${{ steps.drillapp.outputs.secret }}
        run: |
          set +e
          pnpm --silent --filter @ship/cli drill ttfe \
            --base-url http://localhost:3000 --threshold 60000 --json \
            | tee ttfe-pr-result.json
          code=${PIPESTATUS[0]}
          # PIPESTATUS, not $? — $? is `tee`'s status and would report success
          # for a drill that failed, which is the failure mode this gate exists
          # to prevent.
          exit $code

      - name: Stop Ship
        if: always()
        run: kill "$(cat api.pid)" 2>/dev/null || true

      - name: Upload drill timing and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttfe-pr-${{ github.sha }}
          path: |
            ttfe-pr-result.json
            api.log
          retention-days: 30

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # CI-gated deploy (Week 5): auto_deploy is OFF in terraform/render/main.tf,
  # so this job is the only push-driven path to production. No green checks,
  # no deploy — the rollback story is "bad builds never ship" plus a
  # documented `git revert` (CHANGES.md).
  deploy:
    runs-on: ubuntu-latest
    needs: [checks, secret-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/srv-d9p97qpt0dsc73d3sr20/deploys" \
            -d '{}'

  # A deploy is not proof the deployed thing works. This walks the live surface
  # in a real browser after the release lands and fails the run if production is
  # not actually serving. It exists because a deploy was twice reported as
  # successful while prod still ran an older build.
  verify-deployment:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the workspace in dependency order BEFORE anything imports it. The
      # TTFE drill compiles against @ship/sdk (and prove-live may too); without
      # sdk/dist present its tsc fails "Cannot find module '@ship/sdk'" and every
      # downstream type collapses to implicit-any. A full build can't lose the
      # ordering the way `--filter @ship/sdk build` alone did.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for THIS commit to be the live release
        # Not just "ready" — /ready is true on the OLD instance too, so waiting
        # on it let the drill race a not-yet-live deploy and test the previous
        # code. /ready now reports the running RENDER_GIT_COMMIT; wait until it
        # equals the SHA we just pushed, so prove-live and the TTFE drill test
        # THIS build. Up to 15 min (Render build + rollout).
        run: |
          want="${{ github.sha }}"
          for i in $(seq 1 60); do
            body=$(curl -fsS https://ship-api-r1om.onrender.com/ready 2>/dev/null || echo '{}')
            live=$(echo "$body" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)
            if [ "$live" = "$want" ]; then echo "live commit ${live} matches after ${i} checks"; exit 0; fi
            echo "attempt ${i}: live=${live:-<none>} want=${want}"
            sleep 15
          done
          echo "::error::deployed commit never became ${want} (last live: ${live:-<none>})"; exit 1
      - name: Verify the live deployment (browser, with receipts)
        run: pnpm exec playwright test e2e/prove-live.spec.ts --workers=1
      - name: TTFE drill against the live deployment (fails the build past threshold)
        # The proof spine: from a clean checkout, how long until a developer holds
        # a signed event they have verified themselves? Client Credentials against
        # prod as the dedicated first-party drill app (migration 043) — the grader
        # app is read-only and non-first-party by design, so it cannot subscribe
        # or create. The drill app reuses the grader app's secret hash, so the
        # same SHIP_CLIENT_SECRET authenticates it. Poll mode needs no inbound URL
        # — it reads the delivery and its signed_body back from the delivery log
        # and verifies the signature locally. A run over the threshold (60s) exits
        # non-zero and fails this job, exactly like a broken test.
        env:
          SHIP_CLIENT_ID: ship_app_ttfe_drill
          SHIP_CLIENT_SECRET: ${{ secrets.SHIP_CLIENT_SECRET }}
        run: |
          if [ -z "${SHIP_CLIENT_SECRET}" ]; then
            echo "::warning::SHIP_CLIENT_SECRET not set — skipping TTFE drill. Set it in repo secrets to enable the gate."
            exit 0
          fi
          set +e
          pnpm --silent --filter @ship/cli drill ttfe --json | tee ttfe-result.json
          exit ${PIPESTATUS[0]}
      - name: Upload TTFE timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttfe-${{ github.sha }}
          path: ttfe-result.json
          retention-days: 30
      - name: Upload verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-verification-${{ github.sha }}
          path: evidence/
          retention-days: 30
